<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSEO | SEO Automation</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f3f1ec;
            --ink: #2b2a28;
            --muted: #6b675f;
            --accent: #e8672b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .openseo-shell { min-height: 100vh; display: flex; flex-direction: column; }
        .openseo-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.78);
            border-bottom: 1px solid rgba(43, 42, 40, 0.1);
            backdrop-filter: blur(12px);
        }
        .openseo-toolbar strong { font-size: 1rem; }
        .openseo-toolbar span { color: var(--muted); font-size: 0.85rem; margin-left: 8px; }
        .openseo-back { color: var(--accent); font-weight: 600; text-decoration: none; white-space: nowrap; }
        .openseo-frame {
            width: 100%;
            flex: 1;
            min-height: calc(100vh - 57px);
            border: 0;
            background: white;
        }
        @media (max-width: 600px) {
            .openseo-toolbar { align-items: flex-start; flex-direction: column; }
            .openseo-toolbar span { display: block; margin: 2px 0 0; }
        }
    </style>
</head>
<body>
    <div class="openseo-shell">
        <header class="openseo-toolbar">
            <div>
                <strong>OpenSEO</strong>
                <span>Independent SEO research workspace</span>
            </div>
            <a class="openseo-back" href="/">Back to SEO Auto</a>
        </header>
        <iframe class="openseo-frame" src="__OPENSEO_URL__" title="OpenSEO workspace" allow="clipboard-read; clipboard-write"></iframe>
    </div>
</body>
</html>
